<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>AI Contract Clause Screener</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%;padding:.5rem}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🕵️ AI Contract Clause Screener</h1><p>Screen vendor contract text for signing risk.</p><textarea id="t" rows="6" placeholder="Paste contract text..."></textarea><br><button onclick="go()">Screen</button><div id="out"></div><script>function go(){const t=document.getElementById('t').value.toLowerCase();let score=100,flags=[];const risks=[['Unlimited liability',/unlimited liability/,30],['IP grab',/all intellectual property.*(assign|transfer)/,25],['Auto-renewal trap',/auto-?renew/,15],['One-sided indemnity',/indemnify.*(all|any) (claims|losses)/,20],['No SLA remedy',/best efforts.*(support|availability)/,10]];for(const[n,re,w]of risks)if(re.test(t)){score-=w;flags.push('🔴 '+n+' (−'+w+')')}document.getElementById('out').textContent=`Signing risk score: ${Math.max(0,score)}/100 — ${score>=80?'🟢 Low risk':score>=50?'🟡 Negotiate flagged clauses':'🔴 Do not sign as-is'}\n${flags.join('\n')||'No risky patterns found'}\n\nFull screening with benchmarks: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/ai-contract-clause-screener">GitHub</a> · <a href="https://ziontechgroup.com/contract-clause-sentry/">Clause Sentry</a></p></body></html>
